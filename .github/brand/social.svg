<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>update_stuff — one line, every box, fully patched</title>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1E2740"/>
    </pattern>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0F1420"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(96 120) scale(2.4)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="#1A2236"/>
    <path d="M44.2 17.4 A19 19 0 1 0 50.7 28.7" fill="none" stroke="#3DDC97" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M51.6 19.2 L56.4 30.4 L45.6 30.6 Z" fill="#3DDC97" stroke="#3DDC97" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M24 26 L30 32 L24 38" fill="none" stroke="#E8F1EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M33 39 H41" fill="none" stroke="#3DDC97" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- name + tagline -->
  <text x="96" y="380" class="mono" font-size="76" font-weight="800" fill="#E8F1EC">update<tspan fill="#3DDC97">_</tspan>stuff</text>
  <text x="98" y="436" class="mono" font-size="28" fill="#9AA6BF">one line. every box. fully patched.</text>
  <g class="mono" font-size="20" fill="#0F1420" font-weight="700">
    <rect x="96" y="476" rx="15" width="72" height="32" fill="#3DDC97"/><text x="132" y="498" text-anchor="middle">apt</text>
    <rect x="180" y="476" rx="15" width="72" height="32" fill="#3DDC97"/><text x="216" y="498" text-anchor="middle">dnf</text>
    <rect x="264" y="476" rx="15" width="104" height="32" fill="#3DDC97"/><text x="316" y="498" text-anchor="middle">pacman</text>
    <rect x="380" y="476" rx="15" width="104" height="32" fill="#3DDC97"/><text x="432" y="498" text-anchor="middle">zypper</text>
    <rect x="496" y="476" rx="15" width="84" height="32" fill="#FFB547"/><text x="538" y="498" text-anchor="middle">tmux</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(700 150)">
    <rect width="500" height="330" rx="18" fill="#141B2D" stroke="#26304A" stroke-width="2"/>
    <circle cx="28" cy="28" r="7" fill="#FF6B6B"/>
    <circle cx="52" cy="28" r="7" fill="#FFB547"/>
    <circle cx="76" cy="28" r="7" fill="#3DDC97"/>
    <g class="mono" font-size="17">
      <text x="28" y="84" fill="#3DDC97">root@lxc-104<tspan fill="#E8F1EC">:</tspan><tspan fill="#FFB547">~</tspan><tspan fill="#E8F1EC"># curl -fsSL …/update.sh \</tspan></text>
      <text x="28" y="110" fill="#E8F1EC">    | sudo bash</text>
      <text x="28" y="148" fill="#3DDC97">==&gt; <tspan fill="#E8F1EC">updating with apt in tmux</tspan></text>
      <text x="28" y="174" fill="#E8F1EC">    session 'update_stuff'</text>
      <text x="28" y="200" fill="#9AA6BF">Attach to the update session? (y/N) y</text>
      <text x="28" y="238" fill="#9AA6BF">5 upgraded, 0 newly installed …</text>
      <text x="28" y="264" fill="#9AA6BF">Setting up openssl …</text>
      <text x="28" y="300" fill="#3DDC97">==&gt; <tspan fill="#E8F1EC">Updates finished on lxc-104 ✓</tspan></text>
    </g>
  </g>

  <text x="1184" y="590" class="mono" font-size="18" fill="#5B6478" text-anchor="end">github.com/one-more-refactor/update_stuff</text>
</svg>
