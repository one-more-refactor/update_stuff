name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in update.sh media/capture.sh media/demo-env.sh media/stubs/*; do bash -n "$f"; done
      - name: shellcheck
        # shellcheck ships with the ubuntu runner image
        run: |
          shellcheck --version
          shellcheck -x update.sh media/capture.sh media/demo-env.sh media/stubs/* test/test_helper.bash

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats
      - name: bats
        run: bats --print-output-on-failure test/
